<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Links</title>
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,600;1,8..60,400&display=swap"
    rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    :root {
      --void: #050a06;
      --deep: #091209;
      --surf: #0d190f;
      --raised: #122016;
      --card: #17281c;
      --rule: #1e3624;
      --rule-hi: #2a5035;
      --t1: #c8d8cd;
      --t2: #88a891;
      --t3: #56755e;
      --green: #22ee99;
      --green-d: #22ee9930;
      --mono: 'JetBrains Mono', monospace;
      --serif: 'Source Serif 4', Georgia, serif;
    }

    html {
      font-size: 15px
    }

    body {
      font-family: var(--mono);
      background: var(--void);
      color: var(--t2);
      line-height: 1.55;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 0, 0, .03) 2px, rgba(0, 0, 0, .03) 4px);
    }

    .wrap {
      width: 100%;
      max-width: 420px;
      padding: 3rem 1.5rem;
      text-align: center;
    }

    .eyebrow {
      font-size: .65rem;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--green);
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      margin-bottom: 1rem;
    }

    .eyebrow::before {
      content: '';
      width: 6px;
      height: 6px;
      background: var(--green);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--green);
    }

    h1 {
      font-family: var(--serif);
      font-size: 1.65rem;
      font-weight: 600;
      color: var(--t1);
      line-height: 1.3;
      margin-bottom: .5rem;
      letter-spacing: -.02em;
    }

    h1 em {
      font-style: normal;
      color: var(--green)
    }

    .subtitle {
      font-size: .75rem;
      color: var(--t3);
      margin-bottom: 2.5rem;
      line-height: 1.7;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: .75rem;
    }

    .link-btn {
      display: block;
      font-family: var(--mono);
      font-size: .78rem;
      font-weight: 500;
      padding: .85rem 1.5rem;
      border: 1.5px solid var(--rule);
      border-radius: 8px;
      background: var(--surf);
      color: var(--t1);
      text-decoration: none;
      transition: all .2s;
      letter-spacing: .02em;
    }

    .link-btn:hover {
      border-color: var(--green);
      background: var(--green-d);
      color: var(--green);
      transform: translateY(-1px);
      box-shadow: 0 4px 20px var(--green-d);
    }

    .footer {
      margin-top: 2.5rem;
      font-size: .6rem;
      color: var(--t3);
      display: block;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="eyebrow">Landing</div>
    <h1>Digital Brush <em>Converters</em></h1>
    <p class="subtitle">AI-slop technical demos for client-side brush file conversion.</p>

    <div class="links">
      <a class="link-btn" href="tools/csp-to-procreate">CSP to Procreate</a>
      <a class="link-btn" href="tools/procreate-to-csp">Procreate to CSP</a>
    </div>

    <a class="footer" href="https://github.com/javadhamidi/digital-brush-converters">GitHub</a>
  </div>
</body>

</html>
